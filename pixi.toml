[workspace]
name = "mpl-fastapi"
description = "Matplotlib backend integrated with FastAPI"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

# Shared auth token for the demo server and thin clients.
# Every `pixi run` command sees this variable.
[activation.env]
MPL_FASTAPI_TOKEN = "dev-secret-token-do-not-use-in-production"

[dependencies]
python = ">=3.12"
fastapi = ">=0.100.0"
starlette = ">=0.29.0"
matplotlib-base = ">=3.10.0"
uvicorn = ">=0.20.0"
python-multipart = ">=0.0.6"
websockets = ">=11.0"
jinja2 = ">=3.1.0"
pillow = ">=10.0.0"
numpy = ">=1.24.0"
aiofiles = ">=23.0.0"
nodejs = ">=20"
pyside6 = ">=6.10.2,<7"
pytest-qt = ">=4.5.0,<5"
setuptools-scm = ">=9.2.2,<10"


[pypi-dependencies]
mpl-fastapi = { path = ".", editable = true }
sphinxcontrib-openapi = ">=0.8.4"

[feature.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
httpx = ">=0.24.0"
coverage = ">=7.0.0"
pytest-cov = ">=4.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"

[feature.docs.dependencies]
sphinx = ">=6.0.0"
pydata-sphinx-theme = ">=0.15.0"
numpydoc = ">=1.10.0"
sphinx-copybutton = ">=0.5.0"
ipython = ">=8.0.0"
myst-parser = ">=5.0.0,<6"
sphinx-autobuild = ">=2025.8.25,<2026"
sphinxcontrib-mermaid = ">=2.0.1,<3"
sphinx-js = ">=5.0.2,<6"


[environments]
default = ["dev"]
docs = ["docs"]

[tasks]
# JavaScript build tasks
js-install = "npm install"
js-build = "npm run build"
js-watch = "npm run watch"
js-clean = "rm -rf mpl_fastapi/static/js/dist node_modules"
js-lint = "npm run lint"
js-format = "npm run format"
js-format-check = "npm run format:check"
js-typecheck = "npm run typecheck"

# Python build
build = { depends-on = ["js-build"] }

# Development tasks
test = "pytest -v"
test-cov = "pytest --cov=mpl_fastapi --cov-report=html --cov-report=term --cov-report=xml"
lint = "ruff check mpl_fastapi"
format = "ruff format mpl_fastapi"
format-check = "ruff format --check mpl_fastapi"
typecheck = "mypy mpl_fastapi"

# Run the example server
run = "MPL_NO_CACHE_JS=1 uvicorn demos.demo_server:app --reload --host 127.0.0.1 --port 8000"

# Development mode with hot reload (TypeScript watch + React watch + Python server in parallel)
# Note: Runs all processes; Ctrl+C will stop all
dev = "(cd demos/react-example && npm install && npm run build) && MPL_NO_CACHE_JS=1 npm run watch & (cd demos/react-example && npm run dev) & MPL_NO_CACHE_JS=1 uvicorn demos.demo_server:app --reload --host 127.0.0.1 --port 8000"

# Documentation
docs-openapi = { cmd = "python docs/export_openapi.py", default-environment = "docs" }
docs-build = { cmd = "sphinx-build -b html docs/source docs/_build", depends-on = ["docs-openapi"], default-environment = "docs" }
docs-serve = { cmd = "sphinx-autobuild docs/source docs/_build --port 8001", depends-on = ["docs-openapi"], default-environment = "docs" }
docs-clean = { cmd = "rm -rf docs/_build", default-environment = "docs" }

# Clean up
clean = "rm -rf build dist *.egg-info .pytest_cache .coverage htmlcov .mypy_cache .ruff_cache mpl_fastapi/static/js/dist node_modules"

# Combined checks
check = { depends-on = ["format-check", "lint", "typecheck", "js-format-check", "js-lint", "js-typecheck", "test", "js-build"] }
