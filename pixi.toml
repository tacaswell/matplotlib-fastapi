[workspace]
name = "mpl-fastapi"
description = "Matplotlib backend integrated with FastAPI"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.12"
fastapi = ">=0.100.0"
matplotlib-base = ">=3.10.0"
uvicorn = ">=0.20.0"
python-multipart = ">=0.0.6"
websockets = ">=11.0"
jinja2 = ">=3.1.0"
pillow = ">=10.0.0"
numpy = ">=1.24.0"
aiofiles = ">=23.0.0"
nodejs = ">=20"

[pypi-dependencies]
mpl-fastapi = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
httpx = ">=0.24.0"
coverage = ">=7.0.0"
pytest-cov = ">=4.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"

[feature.docs.dependencies]
sphinx = ">=6.0.0"
sphinx-rtd-theme = ">=1.2.0"
numpydoc = ">=1.5.0"
sphinx-copybutton = ">=0.5.0"
ipython = ">=8.0.0"

[environments]
default = ["dev"]
docs = ["docs"]

[tasks]
# JavaScript build tasks
js-install = "npm install"
js-build = "npm run build"
js-watch = "npm run watch"
js-clean = "rm -rf mpl_fastapi/static/js/dist node_modules"

# Python build
build = { depends-on = ["js-build"] }

# Development tasks
test = "pytest -v"
test-cov = "pytest --cov=mpl_fastapi --cov-report=html --cov-report=term"
lint = "ruff check mpl_fastapi"
format = "ruff format mpl_fastapi"
format-check = "ruff format --check mpl_fastapi"
typecheck = "mypy mpl_fastapi"

# Run the example server
run = "uvicorn demos.sine_wave:app --reload --host 127.0.0.1 --port 8000"

# Development mode with hot reload (TypeScript watch + Python server in parallel)
# Note: Runs both processes; Ctrl+C will stop both
dev = "npm run watch & uvicorn demos.sine_wave:app --reload --host 127.0.0.1 --port 8000"

# Documentation
docs-build = "sphinx-build -b html docs docs/_build"
docs-clean = "rm -rf docs/_build"

# Clean up
clean = "rm -rf build dist *.egg-info .pytest_cache .coverage htmlcov .mypy_cache .ruff_cache mpl_fastapi/static/js/dist node_modules"

# Combined checks
check = { depends-on = ["format-check", "lint", "typecheck", "test", "js-build"] }
