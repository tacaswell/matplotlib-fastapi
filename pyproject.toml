[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mpl-fastapi"
dynamic = ["version"]
description = "Matplotlib backend integrated with FastAPI"
readme = "README.rst"
requires-python = ">=3.12"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Thomas A Caswell", email = "tcaswell@gmail.com"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.100.0",
    "matplotlib>=3.10.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0",
    "jinja2>=3.1.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "aiofiles>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/tacaswell/matplotlib-fastapi"
Repository = "https://github.com/tacaswell/matplotlib-fastapi"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "coverage>=7.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "numpydoc>=1.5.0",
    "sphinx-copybutton>=0.5.0",
    "ipython>=8.0.0",
]

[tool.setuptools]
packages = ["mpl_fastapi"]
include-package-data = true

[tool.setuptools.package-data]
mpl_fastapi = ["static/**/*", "templates/**/*", "py.typed"]

[tool.setuptools_scm]
write_to = "mpl_fastapi/_version.py"
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "RET", "SIM", "ARG"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["mpl_fastapi/tests"]
asyncio_mode = "auto"
